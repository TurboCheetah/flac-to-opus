[project]
name = "flac-to-opus"
version = "1.1.0"
description = "Batch transcode FLAC to OPUS"
authors = [{ name = "Turbo", email = "dev@turbo.ooo" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rich>=13.9.4",
]

[project.scripts]
flac-to-opus = "flac_to_opus.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0.0",
  "pytest>=8.0.0",
  "ruff>=0.15.19",
  "ty>=0.0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flac_to_opus"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
  "I",
  "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
