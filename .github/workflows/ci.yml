name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint + type + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"

      - name: Sync and check
        run: |
          uv sync --locked --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check src
          uv run pytest -q

      - name: Build and smoke-test package
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv build
          uv tool install .
          "${UV_TOOL_BIN_DIR}/flac-to-opus" --help
